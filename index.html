<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>AI 이미지 생성기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #252535;
      --border: #2e2e44;
      --accent: #7c6af7;
      --accent2: #9d8ffa;
      --text: #e8e8f0;
      --text2: #9090b0;
      --success: #4caf87;
      --error: #f06060;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .settings-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .settings-btn:hover { color: var(--text); border-color: var(--accent); }

    main {
      flex: 1;
      padding: 20px 16px;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Settings Panel */
    .settings-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      gap: 14px;
      flex-direction: column;
    }
    .settings-panel.open { display: flex; }

    .settings-panel h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: var(--text2);
    }
    label span { color: var(--text); font-size: 13px; }

    input[type="text"], input[type="password"], select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .hint {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.5;
    }
    .hint a { color: var(--accent2); text-decoration: none; }

    /* Generate area */
    .generate-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    textarea#prompt {
      resize: none;
      min-height: 80px;
      line-height: 1.6;
    }

    .options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .enhance-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text2);
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--surface2);
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid var(--border);
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: var(--text2);
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: all 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--accent); border-color: var(--accent); }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(18px);
      background: white;
    }

    .generate-btn {
      background: linear-gradient(135deg, var(--accent), #9d40d8);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      width: 100%;
    }
    .generate-btn:hover { opacity: 0.9; }
    .generate-btn:active { transform: scale(0.98); }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Status */
    .status {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    .status.info {
      display: block;
      background: rgba(124, 106, 247, 0.12);
      border: 1px solid rgba(124, 106, 247, 0.3);
      color: var(--accent2);
    }
    .status.error {
      display: block;
      background: rgba(240, 96, 96, 0.1);
      border: 1px solid rgba(240, 96, 96, 0.3);
      color: var(--error);
    }
    .status.success {
      display: block;
      background: rgba(76, 175, 135, 0.1);
      border: 1px solid rgba(76, 175, 135, 0.3);
      color: var(--success);
    }

    /* Result */
    .result-section {
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .result-section.visible { display: flex; }

    .result-section h3 {
      font-size: 13px;
      color: var(--text2);
      font-weight: 500;
    }

    .image-container {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .enhanced-prompt {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .enhanced-prompt .label {
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .enhanced-prompt p {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }

    .action-row {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 9px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent2); }

    .loading-text {
      color: var(--text2);
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>✦ AI 이미지 생성</h1>
  <button class="settings-btn" onclick="toggleSettings()">⚙ 설정</button>
</header>

<main>

  <!-- Settings -->
  <div class="settings-panel" id="settingsPanel">
    <h2>API 설정</h2>

    <label>
      <span>Hugging Face API 토큰 <span style="color:var(--error)">*</span></span>
      <input type="password" id="hfToken" placeholder="hf_xxxxxxxxxxxx" />
      <span class="hint">
        무료로 발급: <a href="https://huggingface.co/settings/tokens" target="_blank">huggingface.co/settings/tokens</a><br>
        → New token → Read 권한으로 생성
      </span>
    </label>

    <label>
      <span>Claude API 키 (선택 — 한국어 프롬프트 개선용)</span>
      <input type="password" id="claudeKey" placeholder="sk-ant-xxxxxxxxxxxx" />
      <span class="hint">
        없어도 사용 가능. 있으면 한국어 입력 자동 번역 & 프롬프트 품질 향상.
      </span>
    </label>

    <label>
      <span>SD 모델</span>
      <select id="modelSelect">
        <option value="stabilityai/stable-diffusion-2-1">Stable Diffusion 2.1 (권장)</option>
        <option value="runwayml/stable-diffusion-v1-5">Stable Diffusion 1.5</option>
        <option value="stabilityai/stable-diffusion-xl-base-1.0">SDXL Base 1.0 (고품질, 느림)</option>
        <option value="prompthero/openjourney-v4">OpenJourney v4 (아트 스타일)</option>
        <option value="dreamlike-art/dreamlike-photoreal-2.0">Dreamlike Photoreal 2.0 (사진 느낌)</option>
      </select>
    </label>

    <button class="action-btn" onclick="saveSettings()">저장</button>
  </div>

  <!-- Generate -->
  <div class="generate-section">
    <label>
      <span>프롬프트</span>
      <textarea id="prompt" placeholder="예) 석양 지는 해변에서 서핑하는 사람, 영화적인 느낌&#10;(한국어도 OK — Claude가 번역해줍니다)"></textarea>
    </label>

    <div class="options-row">
      <label>
        <span>이미지 크기</span>
        <select id="sizeSelect">
          <option value="512">512×512</option>
          <option value="768">768×768</option>
        </select>
      </label>
      <label>
        <span>스텝 수</span>
        <select id="stepsSelect">
          <option value="20">20 (빠름)</option>
          <option value="30" selected>30 (균형)</option>
          <option value="50">50 (고품질)</option>
        </select>
      </label>
    </div>

    <div class="enhance-row">
      <label class="toggle">
        <input type="checkbox" id="enhanceToggle" checked />
        <span class="toggle-slider"></span>
      </label>
      <span>Claude로 프롬프트 개선 (Claude API 키 필요)</span>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generate()">이미지 생성</button>
  </div>

  <div class="status" id="status"></div>

  <!-- Result -->
  <div class="result-section" id="resultSection">
    <h3>생성 결과</h3>
    <div class="image-container" id="imageContainer">
      <div class="spinner" id="spinner"></div>
    </div>
    <div class="enhanced-prompt" id="enhancedPromptBox" style="display:none">
      <div class="label">사용된 프롬프트</div>
      <p id="enhancedPromptText"></p>
    </div>
    <div class="action-row">
      <button class="action-btn" onclick="downloadImage()">다운로드</button>
      <button class="action-btn" onclick="copyPrompt()">프롬프트 복사</button>
    </div>
  </div>

</main>

<script>
  let generatedImageUrl = null;
  let lastUsedPrompt = '';

  function loadSettings() {
    document.getElementById('hfToken').value = localStorage.getItem('hf_token') || '';
    document.getElementById('claudeKey').value = localStorage.getItem('claude_key') || '';
    const model = localStorage.getItem('sd_model');
    if (model) document.getElementById('modelSelect').value = model;
  }

  function saveSettings() {
    localStorage.setItem('hf_token', document.getElementById('hfToken').value.trim());
    localStorage.setItem('claude_key', document.getElementById('claudeKey').value.trim());
    localStorage.setItem('sd_model', document.getElementById('modelSelect').value);
    showStatus('설정이 저장되었습니다.', 'success');
    setTimeout(() => document.getElementById('settingsPanel').classList.remove('open'), 800);
  }

  function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('open');
  }

  function showStatus(msg, type = 'info') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  function hideStatus() {
    document.getElementById('status').className = 'status';
  }

  async function enhanceWithClaude(prompt, claudeKey) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': claudeKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 300,
        messages: [{
          role: 'user',
          content: `Convert this image prompt to a high-quality Stable Diffusion prompt in English.
If the input is Korean, translate it. Add relevant artistic details (lighting, style, quality tags) to improve the image.
Output ONLY the final prompt, nothing else.

Input: ${prompt}`
        }]
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || 'Claude API 오류');
    }

    const data = await res.json();
    return data.content[0].text.trim();
  }

  async function generate() {
    const hfToken = localStorage.getItem('hf_token') || document.getElementById('hfToken').value.trim();
    const claudeKey = localStorage.getItem('claude_key') || document.getElementById('claudeKey').value.trim();
    const promptText = document.getElementById('prompt').value.trim();
    const model = localStorage.getItem('sd_model') || document.getElementById('modelSelect').value;
    const size = parseInt(document.getElementById('sizeSelect').value);
    const steps = parseInt(document.getElementById('stepsSelect').value);
    const enhance = document.getElementById('enhanceToggle').checked;

    if (!hfToken) {
      showStatus('Hugging Face API 토큰을 설정해주세요. (⚙ 설정 버튼)', 'error');
      return;
    }
    if (!promptText) {
      showStatus('프롬프트를 입력해주세요.', 'error');
      return;
    }

    const btn = document.getElementById('generateBtn');
    btn.disabled = true;

    document.getElementById('resultSection').classList.add('visible');
    document.getElementById('imageContainer').innerHTML = '<div class="spinner"></div><span class="loading-text" style="margin-top:12px"></span>';
    document.getElementById('enhancedPromptBox').style.display = 'none';

    const setLoadingText = (t) => {
      const el = document.querySelector('#imageContainer .loading-text');
      if (el) el.textContent = t;
    };

    try {
      let finalPrompt = promptText;

      if (enhance && claudeKey) {
        showStatus('Claude가 프롬프트를 개선하는 중...', 'info');
        setLoadingText('프롬프트 개선 중...');
        try {
          finalPrompt = await enhanceWithClaude(promptText, claudeKey);
        } catch (e) {
          showStatus('프롬프트 개선 실패, 원본 사용: ' + e.message, 'info');
        }
      } else if (enhance && !claudeKey) {
        showStatus('Claude API 키 없음 — 원본 프롬프트로 생성합니다.', 'info');
      }

      lastUsedPrompt = finalPrompt;

      if (document.getElementById('enhancedPromptText')) {
        document.getElementById('enhancedPromptText').textContent = finalPrompt;
        document.getElementById('enhancedPromptBox').style.display = 'block';
      }

      showStatus('이미지 생성 중... (최대 30~60초)', 'info');
      setLoadingText('이미지 생성 중...');

      const response = await fetch(
        `https://api-inference.huggingface.co/models/${model}`,
        {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${hfToken}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            inputs: finalPrompt,
            parameters: {
              num_inference_steps: steps,
              width: size,
              height: size,
              guidance_scale: 7.5,
            }
          })
        }
      );

      if (!response.ok) {
        const text = await response.text();
        let msg = `HuggingFace 오류 (${response.status})`;
        try {
          const json = JSON.parse(text);
          if (json.error) msg += ': ' + json.error;
          if (json.estimated_time) msg += ` — 모델 로딩 중, ${Math.ceil(json.estimated_time)}초 후 재시도`;
        } catch {}
        throw new Error(msg);
      }

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      generatedImageUrl = url;

      document.getElementById('imageContainer').innerHTML = `<img src="${url}" alt="생성된 이미지" />`;
      showStatus('이미지 생성 완료!', 'success');

    } catch (err) {
      document.getElementById('imageContainer').innerHTML = `<span style="color:var(--error);font-size:13px;padding:20px;text-align:center">${err.message}</span>`;
      showStatus(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  function downloadImage() {
    if (!generatedImageUrl) return;
    const a = document.createElement('a');
    a.href = generatedImageUrl;
    a.download = `ai-image-${Date.now()}.png`;
    a.click();
  }

  function copyPrompt() {
    if (!lastUsedPrompt) return;
    navigator.clipboard.writeText(lastUsedPrompt).then(() => {
      showStatus('프롬프트가 클립보드에 복사되었습니다.', 'success');
    });
  }

  loadSettings();
</script>
</body>
</html>
