# 내 주식 포트폴리오 설정
#
# market: KR(국내) 또는 US(해외)
# ticker: 국내는 6자리 종목코드(예: 삼성전자 005930), 해외는 티커(예: AAPL)
# quantity, avg_price: 선택 입력. 채워두면 평가손익까지 계산해줍니다.
#   - KR avg_price 단위는 원, US avg_price 단위는 달러
#
# 아래는 예시입니다. 실제 보유 종목으로 교체해주세요.

holdings:
  - market: KR
    ticker: "005930"
    name: 삼성전자
    quantity: 10
    avg_price: 70000
  - market: KR
    ticker: "000660"
    name: SK하이닉스
    quantity: 5
    avg_price: 180000
  - market: US
    ticker: AAPL
    name: Apple
    quantity: 5
    avg_price: 180.0
  - market: US
    ticker: NVDA
    name: NVIDIA
    quantity: 3
    avg_price: 120.0

notify:
  time: "07:00"
  timezone: "Asia/Seoul"
